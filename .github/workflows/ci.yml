name: TLang CI

permissions:
  contents: read

on:
  push:
    branches: [ main, v0.2, v0.3-m4-packages, v0.4-m1-database, v0.4-m2-migrations ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build, test, and validate version
        run: ./gradlew clean check --no-daemon --console=plain

      - name: Build all artifacts
        run: ./gradlew build --no-daemon --console=plain

      - name: Build distribution and run installed CLI smoke test
        run: ./gradlew distributionSmokeTest

      - name: Compile and smoke test JMH benchmarks
        run: ./gradlew benchmarkSmoke --no-daemon --console=plain

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  concurrent-http-stress:
    name: Concurrent HTTP test (10 consecutive runs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run concurrent HTTP test 10 consecutive times
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "::group::Concurrent HTTP test iteration ${iteration}/10"
            if ./gradlew test \
              --tests dev.tlang.runtime.http.ConcurrentHttpServerTest \
              --rerun-tasks \
              --no-daemon \
              --console=plain; then
              echo "Concurrent HTTP test iteration ${iteration}/10 passed"
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::Concurrent HTTP test iteration ${iteration}/10 failed (exit ${status})"
              exit "${status}"
            fi
          done

      - name: Upload concurrency test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concurrent-http-test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  postgres-database:
    name: PostgreSQL integration and stress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run real PostgreSQL integration suite
        run: ./gradlew postgresIntegrationTest --no-daemon --console=plain

      - name: Repeat PostgreSQL database and migration concurrency tests 10 times
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "::group::PostgreSQL stress iteration ${iteration}/10"
            if ./gradlew postgresIntegrationTest \
              --tests 'dev.tlang.runtime.database.PostgresIntegrationTest.concurrentReadsWritesAndMixedLoadPreserveAllRows' \
              --tests 'dev.tlang.runtime.database.PostgresRuntimeIntegrationTest.*' \
              --tests 'dev.tlang.runtime.database.PostgresMigrationIntegrationTest.concurrentMigratorsSerializeWithoutDoubleApplication' \
              --tests 'dev.tlang.runtime.database.PostgresMigrationIntegrationTest.lockAndPoolRecoverAfterConcurrentFailuresAndCredentialsStayRedacted' \
              --rerun-tasks \
              --no-daemon \
              --console=plain; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::PostgreSQL stress iteration ${iteration}/10 failed (exit ${status})"
              exit "${status}"
            fi
          done

      - name: Upload PostgreSQL test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-test-results
          path: build/reports/tests/postgresIntegrationTest
          if-no-files-found: ignore

  task-runtime-stress:
    name: Task runtime tests (10 consecutive runs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run task runtime tests 10 consecutive times
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "::group::Task runtime tests iteration ${iteration}/10"
            if ./gradlew test \
              --tests dev.tlang.runtime.task.TaskRuntimeTest \
              --tests dev.tlang.runtime.http.TaskHttpServerTest \
              --rerun-tasks \
              --no-daemon \
              --console=plain; then
              echo "Task runtime tests iteration ${iteration}/10 passed"
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::Task runtime tests iteration ${iteration}/10 failed (exit ${status})"
              exit "${status}"
            fi
          done

      - name: Upload task test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task-runtime-test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  package-tests:
    name: Package manager (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Run deterministic package manager suites (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew packageTests --no-daemon --console=plain
      - name: Run deterministic package manager suites (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat packageTests --no-daemon --console=plain
      - name: Upload package test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results-${{ matrix.os }}
          path: build/reports/tests/packageTests
          if-no-files-found: ignore

  package-stress:
    name: Package resolver/install/import tests (10 consecutive runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Repeat critical package suites
        shell: bash
        run: |
          for iteration in {1..10}; do
            echo "::group::Package tests iteration ${iteration}/10"
            if ./gradlew test \
              --tests dev.tlang.packages.PackageManagerIntegrationTest \
              --tests dev.tlang.packages.PackageCliAndImportTest \
              --tests dev.tlang.packages.PackageSecurityAndFailureTest \
              --rerun-tasks \
              --no-daemon \
              --console=plain; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::Package tests iteration ${iteration}/10 failed (exit ${status})"
              exit "${status}"
            fi
          done
      - name: Upload package stress results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-stress-test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  distribution-smoke:
    name: Distribution smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build distribution (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew installDist
      - name: Smoke test distribution (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/release_smoke_test.sh
      - name: Build distribution (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat installDist
      - name: Smoke test distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\release_smoke_test.ps1
