name: TLang CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build, test, and validate version
        run: ./gradlew clean check

      - name: Build distribution and run installed CLI smoke test
        run: ./gradlew distributionSmokeTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  distribution-smoke:
    name: Distribution smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Build distribution (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew installDist
      - name: Smoke test distribution (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/release_smoke_test.sh
      - name: Build distribution (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat installDist
      - name: Smoke test distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\release_smoke_test.ps1
