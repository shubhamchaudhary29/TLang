name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate immutable tag and repair source
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git diff --exit-code "${RELEASE_TAG}^{commit}" HEAD -- gradle.properties src packaging
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"
          fi
          ./gradlew verifyVersion

  package:
    needs: validate-source
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@v4
      - name: Validate tag and build installer (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew clean check jpackage
      - name: Validate tag and build installer (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean test packageTests verifyVersion jpackage
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: build/jpackage/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/**
